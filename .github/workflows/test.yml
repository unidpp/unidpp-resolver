name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain step: rustup resolves rust-toolchain.toml at
      # every cargo invocation, so CI installs and formats with the
      # exact pinned generation (the file is the single source).
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

